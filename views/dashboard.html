<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Harold's Free Hotline — Dashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --amber:   #f59e0b;
      --amber-lt:#fde68a;
      --amber-dk:#d97706;
      --bg:      #fef3c7;
      --surface: #ffffff;
      --border:  #fcd34d;
      --text:    #1c1917;
      --muted:   #78716c;
      --confession: #7c3aed;
      --speak:   #0369a1;
      --question: #b45309;
      --wisdom:   #166534;
      --green:   #16a34a;
      --red:     #dc2626;
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ──────────────────────────────────────────────────────────── */
    header {
      background: linear-gradient(135deg, var(--amber-dk), var(--amber));
      color: #fff;
      padding: 1.5rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,.15);
    }
    .paw { font-size: 2.5rem; }
    header h1 { font-size: 1.75rem; font-weight: 800; letter-spacing: -0.5px; }
    header p  { font-size: .9rem; opacity: .9; margin-top: .1rem; }

    /* ── Stats ───────────────────────────────────────────────────────────── */
    .stats {
      display: flex;
      gap: 1rem;
      padding: 1.5rem 2rem;
      flex-wrap: wrap;
    }
    .stat-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.5rem;
      min-width: 130px;
      flex: 1;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    .stat-card .value { font-size: 2rem; font-weight: 800; color: var(--amber-dk); }
    .stat-card .label { font-size: .8rem; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: .2rem; }

    /* ── Calls table ─────────────────────────────────────────────────────── */
    .calls-section { padding: 0 2rem 2rem; }
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1rem;
    }
    .section-header h2 { font-size: 1.1rem; font-weight: 700; }
    .refresh-btn {
      background: var(--amber);
      border: none;
      border-radius: 8px;
      padding: .4rem .9rem;
      font-size: .85rem;
      font-weight: 600;
      color: #fff;
      cursor: pointer;
      transition: background .15s;
    }
    .refresh-btn:hover { background: var(--amber-dk); }
    .refresh-btn.active {
      background: var(--green);
      box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--green);
    }
    .refresh-btn.active:hover { background: #15803d; }

    .calls-table {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }
    table { width: 100%; border-collapse: collapse; }
    thead { background: var(--amber-lt); }
    th {
      text-align: left;
      padding: .75rem 1rem;
      font-size: .8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .5px;
      color: var(--amber-dk);
      border-bottom: 1.5px solid var(--border);
    }
    tbody tr {
      border-bottom: 1px solid #fef3c7;
      transition: background .1s;
    }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #fffbeb; cursor: pointer; }
    tbody tr.expanded { background: #fffbeb; }
    td { padding: .75rem 1rem; font-size: .9rem; vertical-align: middle; }

    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: .2rem .65rem;
      font-size: .75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
    }
    .badge-confession { background: #ede9fe; color: var(--confession); }
    .badge-speak      { background: #e0f2fe; color: var(--speak); }
    .badge-question   { background: #fef3c7; color: var(--question); }
    .badge-wisdom     { background: #dcfce7; color: var(--wisdom); }
    .badge-unknown    { background: #f3f4f6; color: var(--muted); }

    .ts-status {
      font-size: .75rem;
      padding: .15rem .5rem;
      border-radius: 999px;
    }
    .ts-completed { background: #dcfce7; color: var(--green); }
    .ts-pending   { background: #fef9c3; color: #a16207; }
    .ts-failed    { background: #fee2e2; color: var(--red); }
    .ts-none      { background: #f3f4f6; color: var(--muted); }

    /* ── Expanded detail row ─────────────────────────────────────────────── */
    .detail-row { display: none; }
    .detail-row.open { display: table-row; }
    .detail-cell {
      padding: 1rem 1.5rem 1.25rem;
      background: #fffbeb;
      border-bottom: 1.5px solid var(--border);
    }
    .detail-inner {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }
    @media (max-width: 640px) { .detail-inner { grid-template-columns: 1fr; } }

    .detail-box { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 1rem; }
    .detail-box h3 { font-size: .8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-bottom: .6rem; }

    .transcript-text {
      font-size: .9rem;
      line-height: 1.6;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .no-transcript { color: var(--muted); font-style: italic; font-size: .9rem; }

    audio { width: 100%; margin-top: .4rem; border-radius: 6px; }

    /* ── Empty / loading ─────────────────────────────────────────────────── */
    .empty {
      text-align: center;
      padding: 3rem;
      color: var(--muted);
    }
    .empty .cat { font-size: 3rem; display: block; margin-bottom: .75rem; }

    .loading {
      text-align: center;
      padding: 2rem;
      color: var(--muted);
      font-style: italic;
    }

    /* ── Flagged rows ────────────────────────────────────────────────────── */
    tr.flagged-row td { background: #fff1f2; }
    tr.flagged-row:hover td { background: #ffe4e6; }

    /* ── Generated post ──────────────────────────────────────────────────── */
    .generated-post {
      margin-top: 1rem;
      padding: .75rem 1rem;
      background: #fefce8;
      border: 1.5px solid #fde68a;
      border-radius: 10px;
      font-size: .875rem;
      line-height: 1.5;
      white-space: pre-wrap;
    }
    .post-actions {
      display: flex;
      gap: .5rem;
      margin-top: .5rem;
    }

    /* ── Voiceover tool ──────────────────────────────────────────────────── */
    .voiceover-section { margin: 1.5rem auto; max-width: 960px; padding: 0 1rem; }
    .vo-body { background: var(--surface); border: 1.5px solid var(--border); border-radius: 14px; padding: 1.25rem; margin-top: .75rem; }
    .vo-body textarea {
      width: 100%; min-height: 90px; padding: .6rem .8rem;
      border: 1.5px solid var(--border); border-radius: 8px;
      font-family: inherit; font-size: .9rem; resize: vertical;
    }
    .vo-body textarea:focus { outline: none; border-color: var(--amber); }
    .vo-row { display: flex; gap: .6rem; margin-top: .6rem; flex-wrap: wrap; align-items: center; }
    .vo-row select {
      padding: .4rem .7rem; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: .85rem; background: var(--surface); cursor: pointer;
    }
    .vo-generate { background: var(--amber); border: none; border-radius: 8px; padding: .4rem 1rem; font-size: .85rem; font-weight: 600; cursor: pointer; transition: background .15s; }
    .vo-generate:hover { background: var(--amber-dk); }
    .vo-generate:disabled { opacity: .5; cursor: default; }
    .vo-result { margin-top: 1rem; display: flex; align-items: center; gap: .75rem; flex-wrap: wrap; }
    .vo-result audio { flex: 1; min-width: 200px; }
    .vo-download { font-size: .85rem; padding: .4rem .8rem; background: var(--surface); border: 1.5px solid var(--border); border-radius: 8px; text-decoration: none; color: var(--text); cursor: pointer; }
    .vo-download:hover { background: var(--amber-lt); border-color: var(--amber); }

    /* ── Admin buttons ───────────────────────────────────────────────────── */
    .admin-actions {
      display: flex;
      gap: .5rem;
      margin-top: 1rem;
      padding-top: .75rem;
      border-top: 1px solid var(--border);
    }
    .admin-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: .35rem .8rem;
      font-size: .8rem;
      cursor: pointer;
      transition: all .15s;
    }
    .admin-btn:hover { background: #f3f4f6; }
    .admin-btn.danger { border-color: #fca5a5; color: var(--red); }
    .admin-btn.danger:hover { background: #fff1f2; }
    .admin-btn.flagged { border-color: #fca5a5; background: #fff1f2; color: var(--red); }

    /* ── Pagination ──────────────────────────────────────────────────────── */
    .pagination {
      display: flex;
      justify-content: center;
      gap: .5rem;
      margin-top: 1rem;
    }
    .page-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: .4rem .9rem;
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
    }
    .page-btn:hover:not(:disabled) { background: var(--amber-lt); border-color: var(--amber); }
    .page-btn:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>

<header>
  <div class="paw">🐱</div>
  <div>
    <h1>Harold's Free Hotline</h1>
    <p>Call center dashboard — all confessions &amp; conversations logged here</p>
  </div>
</header>

<section class="stats" id="stats">
  <div class="stat-card"><div class="value" id="stat-total">—</div><div class="label">Total Calls</div></div>
  <div class="stat-card"><div class="value" id="stat-confessions">—</div><div class="label">Confessions</div></div>
  <div class="stat-card"><div class="value" id="stat-speak">—</div><div class="label">Spoke to Harold</div></div>
  <div class="stat-card"><div class="value" id="stat-questions">—</div><div class="label">Advice Sought</div></div>
  <div class="stat-card"><div class="value" id="stat-wisdom">—</div><div class="label">Wisdom Seekers</div></div>
  <div class="stat-card"><div class="value" id="stat-recordings">—</div><div class="label">Recordings</div></div>
</section>

<section class="voiceover-section">
  <div class="section-header">
    <h2>Voiceover Generator</h2>
    <button class="refresh-btn" onclick="toggleVoiceover()">↕ Show / Hide</button>
  </div>
  <div class="vo-body" id="vo-panel" style="display:none">
    <textarea id="vo-text" placeholder="Enter the text you'd like Harold's announcer to read…"></textarea>
    <div class="vo-row">
      <select id="vo-voice">
        <option value="fable">Fable — British male (closest to Harold's announcer)</option>
        <option value="onyx">Onyx — Deep male</option>
        <option value="echo">Echo — Male</option>
        <option value="alloy">Alloy — Neutral</option>
        <option value="nova">Nova — Female</option>
        <option value="shimmer">Shimmer — Soft female</option>
      </select>
      <select id="vo-model">
        <option value="tts-1-hd">HD quality</option>
        <option value="tts-1">Standard</option>
      </select>
      <button class="vo-generate" id="vo-btn" onclick="generateVoiceover()">🎙 Generate</button>
    </div>
    <div class="vo-result" id="vo-result" style="display:none">
      <audio id="vo-player" controls></audio>
      <a id="vo-download" class="vo-download" download="harold-voiceover.mp3">⬇ Download MP3</a>
    </div>
  </div>
</section>

<section class="calls-section">
  <div class="section-header">
    <h2>Recent Calls</h2>
    <div style="display:flex;gap:8px;align-items:center">
      <button class="refresh-btn" id="btn-filter-recording" onclick="toggleRecordingFilter()" title="Show only calls with a recording">🎙 Has Recording</button>
      <button class="refresh-btn" onclick="loadCalls(0)">↻ Refresh</button>
    </div>
  </div>

  <div class="calls-table">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Date &amp; Time</th>
          <th>Caller</th>
          <th>Type</th>
          <th>Duration</th>
          <th>Transcript</th>
        </tr>
      </thead>
      <tbody id="calls-body">
        <tr><td colspan="6" class="loading">Loading calls…</td></tr>
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button class="page-btn" id="btn-prev" onclick="prevPage()" disabled>← Previous</button>
    <button class="page-btn" id="btn-next" onclick="nextPage()" disabled>Next →</button>
  </div>
</section>

<script>
  const PAGE_SIZE = 25;
  let currentOffset = 0;
  let totalCalls = 0;
  let filterRecording = false;

  function toggleRecordingFilter() {
    filterRecording = !filterRecording;
    document.getElementById('btn-filter-recording').classList.toggle('active', filterRecording);
    loadCalls(0);
  }

  function maskNumber(num) {
    return num || '—';
  }

  const AREA_CODE_STATE = {
    205:'AL',251:'AL',256:'AL',334:'AL',938:'AL',
    907:'AK',
    480:'AZ',520:'AZ',602:'AZ',623:'AZ',928:'AZ',
    479:'AR',501:'AR',870:'AR',
    209:'CA',213:'CA',279:'CA',310:'CA',323:'CA',341:'CA',408:'CA',415:'CA',424:'CA',442:'CA',510:'CA',530:'CA',559:'CA',562:'CA',619:'CA',626:'CA',628:'CA',650:'CA',657:'CA',661:'CA',669:'CA',707:'CA',714:'CA',747:'CA',760:'CA',805:'CA',818:'CA',820:'CA',831:'CA',858:'CA',909:'CA',916:'CA',925:'CA',949:'CA',951:'CA',
    303:'CO',719:'CO',720:'CO',970:'CO',
    203:'CT',475:'CT',860:'CT',959:'CT',

    229:'GA',404:'GA',470:'GA',478:'GA',678:'GA',706:'GA',762:'GA',770:'GA',912:'GA',
    808:'HI',

    217:'IL',224:'IL',309:'IL',312:'IL',331:'IL',447:'IL',464:'IL',618:'IL',630:'IL',708:'IL',773:'IL',779:'IL',815:'IL',847:'IL',872:'IL',

    319:'IA',515:'IA',563:'IA',641:'IA',712:'IA',

    270:'KY',364:'KY',502:'KY',606:'KY',859:'KY',
    225:'LA',318:'LA',337:'LA',504:'LA',985:'LA',
    207:'ME',
    240:'MD',301:'MD',410:'MD',443:'MD',667:'MD',
    339:'MA',351:'MA',413:'MA',508:'MA',617:'MA',774:'MA',781:'MA',857:'MA',978:'MA',
    231:'MI',248:'MI',269:'MI',313:'MI',517:'MI',586:'MI',616:'MI',679:'MI',734:'MI',810:'MI',906:'MI',947:'MI',989:'MI',
    218:'MN',320:'MN',507:'MN',612:'MN',651:'MN',763:'MN',952:'MN',

    314:'MO',417:'MO',573:'MO',636:'MO',660:'MO',816:'MO',

    603:'NH',

    505:'NM',575:'NM',
    212:'NY',315:'NY',329:'NY',332:'NY',347:'NY',363:'NY',516:'NY',518:'NY',585:'NY',607:'NY',631:'NY',646:'NY',680:'NY',716:'NY',718:'NY',838:'NY',845:'NY',914:'NY',917:'NY',929:'NY',934:'NY',
    252:'NC',336:'NC',704:'NC',743:'NC',828:'NC',910:'NC',919:'NC',980:'NC',984:'NC',

    215:'PA',223:'PA',267:'PA',272:'PA',412:'PA',445:'PA',484:'PA',570:'PA',610:'PA',717:'PA',724:'PA',814:'PA',835:'PA',878:'PA',
    401:'RI',
    803:'SC',839:'SC',843:'SC',854:'SC',864:'SC',
    605:'SD',
    423:'TN',615:'TN',629:'TN',731:'TN',865:'TN',901:'TN',931:'TN',
    210:'TX',214:'TX',254:'TX',281:'TX',325:'TX',346:'TX',361:'TX',409:'TX',430:'TX',432:'TX',469:'TX',512:'TX',682:'TX',713:'TX',726:'TX',737:'TX',806:'TX',817:'TX',830:'TX',832:'TX',903:'TX',915:'TX',936:'TX',940:'TX',945:'TX',956:'TX',972:'TX',979:'TX',
    385:'UT',435:'UT',801:'UT',
    802:'VT',
    276:'VA',434:'VA',540:'VA',571:'VA',703:'VA',757:'VA',804:'VA',
    206:'WA',253:'WA',360:'WA',425:'WA',509:'WA',564:'WA',
    304:'WV',681:'WV',
    262:'WI',414:'WI',534:'WI',608:'WI',715:'WI',920:'WI',
    307:'WY',
    787:'PR',939:'PR',
    340:'VI',671:'GU',
  };
  const STATE_NAMES = {
    AL:'Alabama',AK:'Alaska',AZ:'Arizona',AR:'Arkansas',CA:'California',CO:'Colorado',CT:'Connecticut',DE:'Delaware',DC:'Washington D.C.',FL:'Florida',GA:'Georgia',HI:'Hawaii',ID:'Idaho',IL:'Illinois',IN:'Indiana',IA:'Iowa',KS:'Kansas',KY:'Kentucky',LA:'Louisiana',ME:'Maine',MD:'Maryland',MA:'Massachusetts',MI:'Michigan',MN:'Minnesota',MS:'Mississippi',MO:'Missouri',MT:'Montana',NE:'Nebraska',NV:'Nevada',NH:'New Hampshire',NJ:'New Jersey',NM:'New Mexico',NY:'New York',NC:'North Carolina',ND:'North Dakota',OH:'Ohio',OK:'Oklahoma',OR:'Oregon',PA:'Pennsylvania',RI:'Rhode Island',SC:'South Carolina',SD:'South Dakota',TN:'Tennessee',TX:'Texas',UT:'Utah',VT:'Vermont',VA:'Virginia',WA:'Washington',WV:'West Virginia',WI:'Wisconsin',WY:'Wyoming',PR:'Puerto Rico',VI:'U.S. Virgin Islands',GU:'Guam',
  };
  function callerLocation(num) {
    if (!num || !num.startsWith('+1') || num.length !== 12) return null;
    const abbr = AREA_CODE_STATE[parseInt(num.slice(2, 5), 10)];
    return abbr ? STATE_NAMES[abbr] || abbr : null;
  }

  function formatDate(iso) {
    if (!iso) return '—';
    // SQLite CURRENT_TIMESTAMP has no timezone marker — append Z to treat as UTC
    const d = new Date(iso.includes('T') ? iso : iso.replace(' ', 'T') + 'Z');
    const tz = { timeZone: 'America/New_York' };
    return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', ...tz }) +
      ' ' + d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', ...tz });
  }

  function formatDuration(secs) {
    if (!secs) return '—';
    const m = Math.floor(secs / 60), s = secs % 60;
    return m > 0 ? `${m}m ${s}s` : `${s}s`;
  }

  function typeBadge(type) {
    if (type === 'confession') return '<span class="badge badge-confession">🗣 Confession</span>';
    if (type === 'speak')      return '<span class="badge badge-speak">😺 Spoke to Harold</span>';
    if (type === 'question')   return '<span class="badge badge-question">❓ Advice</span>';
    if (type === 'wisdom')     return '<span class="badge badge-wisdom">🐾 Wisdom</span>';
    return '<span class="badge badge-unknown">?</span>';
  }

  function transcriptBadge(status) {
    const map = {
      completed: '<span class="ts-status ts-completed">✓ Ready</span>',
      pending:   '<span class="ts-status ts-pending">⏳ Pending</span>',
      failed:    '<span class="ts-status ts-failed">✗ Failed</span>',
      none:      '<span class="ts-status ts-none">—</span>',
    };
    return map[status] || map.none;
  }

  async function loadStats() {
    const res = await fetch('/dashboard/api/stats');
    if (!res.ok) return;
    const s = await res.json();
    document.getElementById('stat-total').textContent       = s.total ?? 0;
    document.getElementById('stat-confessions').textContent = s.confessions ?? 0;
    document.getElementById('stat-speak').textContent       = s.speak_calls ?? 0;
    document.getElementById('stat-questions').textContent   = s.questions ?? 0;
    document.getElementById('stat-wisdom').textContent      = s.wisdom_calls ?? 0;
    document.getElementById('stat-recordings').textContent  = s.recordings ?? 0;
  }

  async function loadCalls(offset = 0) {
    currentOffset = offset;
    const tbody = document.getElementById('calls-body');
    tbody.innerHTML = '<tr><td colspan="6" class="loading">Loading…</td></tr>';

    const res = await fetch(`/dashboard/api/calls?limit=${PAGE_SIZE}&offset=${offset}${filterRecording ? '&hasRecording=1' : ''}`);
    if (!res.ok) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty"><span class="cat">😿</span>Failed to load calls.</td></tr>';
      return;
    }
    const { calls, total } = await res.json();
    totalCalls = total;

    document.getElementById('btn-prev').disabled = offset === 0;
    document.getElementById('btn-next').disabled = offset + PAGE_SIZE >= total;

    if (!calls.length) {
      tbody.innerHTML = '<tr><td colspan="6" class="empty"><span class="cat">😴</span>No calls yet — Harold is still napping.</td></tr>';
      return;
    }

    tbody.innerHTML = calls.map((call, i) => `
      <tr onclick="toggleDetail(${call.id})" id="row-${call.id}" class="${call.flagged ? 'flagged-row' : ''}">
        <td>${offset + i + 1}${call.flagged ? ' 🚩' : ''}</td>
        <td>${formatDate(call.created_at)}</td>
        <td style="font-family:monospace;font-size:.85rem">${maskNumber(call.caller_number)}${callerLocation(call.caller_number) ? `<br><span style="font-family:system-ui;font-size:.72rem;color:var(--muted)">${callerLocation(call.caller_number)}</span>` : ''}</td>
        <td>${typeBadge(call.call_type)}</td>
        <td>${formatDuration(call.duration)}</td>
        <td>${transcriptBadge(call.transcript_status)}</td>
      </tr>
      <tr class="detail-row" id="detail-${call.id}">
        <td colspan="6" class="detail-cell">
          <div class="detail-inner">
            <div class="detail-box">
              <h3>Transcript</h3>
              ${call.transcript
                ? `<p class="transcript-text">${escapeHtml(call.transcript)}</p>`
                : `<p class="no-transcript">No transcript available${call.transcript_status === 'pending' ? ' yet — check back soon.' : '.'}</p>`
              }
            </div>
            <div class="detail-box">
              <h3>Recording</h3>
              ${call.recording_sid
                ? `<audio controls src="/dashboard/api/calls/${call.id}/recording"></audio>`
                : '<p class="no-transcript">No recording for this call.</p>'
              }
              <div style="margin-top:.75rem;font-size:.8rem;color:var(--muted)">
                <div><strong>Call SID:</strong> ${escapeHtml(call.call_sid || '—')}</div>
                <div><strong>Status:</strong> ${escapeHtml(call.call_status || '—')}</div>
              </div>
            </div>
          </div>
          <div class="admin-actions">
            <button class="admin-btn ${call.flagged ? 'flagged' : ''}" onclick="event.stopPropagation();adminFlagCall(${call.id})">
              🚩 ${call.flagged ? 'Unflag' : 'Flag'} call
            </button>
            ${call.recording_sid ? `<button class="admin-btn danger" onclick="event.stopPropagation();adminDeleteRecording(${call.id})">🗑 Delete recording</button>` : ''}
            ${call.transcript ? `<button class="admin-btn" onclick="event.stopPropagation();generatePost(${call.id})">✨ Generate post</button>` : ''}
          </div>
          <div id="post-${call.id}" style="display:none"></div>
        </td>
      </tr>
    `).join('');
  }

  function toggleDetail(id) {
    const row = document.getElementById(`row-${id}`);
    const detail = document.getElementById(`detail-${id}`);
    const open = detail.classList.toggle('open');
    if (open) {
      row.classList.add('expanded');
    } else {
      row.classList.remove('expanded');
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function prevPage() { if (currentOffset >= PAGE_SIZE) loadCalls(currentOffset - PAGE_SIZE); }
  function nextPage() { if (currentOffset + PAGE_SIZE < totalCalls) loadCalls(currentOffset + PAGE_SIZE); }

  // ── Voiceover ─────────────────────────────────────────────────────────────
  function toggleVoiceover() {
    const panel = document.getElementById('vo-panel');
    panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  }

  async function generateVoiceover() {
    const text  = document.getElementById('vo-text').value.trim();
    const voice = document.getElementById('vo-voice').value;
    const model = document.getElementById('vo-model').value;
    if (!text) { alert('Please enter some text first.'); return; }

    const btn = document.getElementById('vo-btn');
    btn.disabled = true;
    btn.textContent = 'Generating…';
    document.getElementById('vo-result').style.display = 'none';

    const res = await adminFetch('/dashboard/api/voiceover', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text, voice, model }),
    });

    btn.disabled = false;
    btn.textContent = '🎙 Generate';

    if (!res || !res.ok) {
      const err = await res?.json().catch(() => ({}));
      alert(err.error || 'Failed to generate voiceover.');
      return;
    }

    const blob = await res.blob();
    const url  = URL.createObjectURL(blob);
    const player   = document.getElementById('vo-player');
    const download = document.getElementById('vo-download');
    player.src   = url;
    download.href = url;
    document.getElementById('vo-result').style.display = 'flex';
    player.play();
  }

  // ── Admin ─────────────────────────────────────────────────────────────────
  function adminHeaders() {
    const pass = sessionStorage.getItem('adminPass');
    return pass ? { Authorization: 'Basic ' + btoa('admin:' + pass) } : {};
  }

  async function adminFetch(url, options = {}) {
    options.headers = { ...options.headers, ...adminHeaders() };
    let res = await fetch(url, options);
    if (res.status === 401) {
      const pass = prompt('Admin password:');
      if (pass === null) return null;
      sessionStorage.setItem('adminPass', pass);
      options.headers = { ...options.headers, Authorization: 'Basic ' + btoa('admin:' + pass) };
      res = await fetch(url, options);
    }
    return res;
  }

  async function generatePost(id) {
    const container = document.getElementById(`post-${id}`);
    container.style.display = 'block';
    container.innerHTML = '<p style="font-size:.85rem;color:var(--muted)">✨ Harold is consulting his inner wisdom…</p>';
    const res = await adminFetch(`/dashboard/api/calls/${id}/generate-post`, { method: 'POST' });
    if (!res) { container.style.display = 'none'; return; }
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      container.innerHTML = `<p style="font-size:.85rem;color:var(--red)">${escapeHtml(err.error || 'Failed to generate post.')}</p>`;
      return;
    }
    const { post } = await res.json();
    container.innerHTML = `
      <div class="generated-post">${escapeHtml(post)}</div>
      <div class="post-actions">
        <button class="admin-btn" onclick="navigator.clipboard.writeText(${JSON.stringify(post)}).then(()=>{this.textContent='✓ Copied';setTimeout(()=>{this.textContent='Copy'},1500)})">Copy</button>
        <button class="admin-btn" onclick="generatePost(${id})">↻ Regenerate</button>
      </div>`;
  }

  async function adminFlagCall(id) {
    const res = await adminFetch(`/dashboard/api/calls/${id}/flag`, { method: 'PATCH' });
    if (res && res.ok) loadCalls(currentOffset);
  }

  async function adminDeleteRecording(id) {
    if (!confirm('Permanently delete this recording from Twilio? This cannot be undone.')) return;
    const res = await adminFetch(`/dashboard/api/calls/${id}/recording`, { method: 'DELETE' });
    if (res && res.ok) {
      loadCalls(currentOffset);
      loadStats();
    } else if (res) {
      alert('Failed to delete recording.');
    }
  }

  // Auto-refresh every 30s
  loadStats();
  loadCalls(0);
  setInterval(() => { loadStats(); loadCalls(currentOffset); }, 30000);
</script>
</body>
</html>
